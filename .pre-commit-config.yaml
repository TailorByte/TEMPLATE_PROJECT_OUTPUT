# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0 # Use the latest version
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-docstring-first
    -   id: check-executables-have-shebangs
    -   id: check-merge-conflict
    -   id: debug-statements
    -   id: name-tests-test
        args: ['--django']

# Python formatting and linting
-   repo: https://github.com/psf/black
    rev: 24.4.2 # Use the latest version
    hooks:
    -   id: black
        args: [--line-length=88]
        language_version: python3

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2 # Use the latest version
    hooks:
    -   id: isort
        name: isort (python)
        args: ["--profile", "black", "--filter-files"]

-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0 # Use the latest version
    hooks:
    -   id: flake8
        # additional_dependencies: [flake8-docstrings, pep8-naming] # Add any flake8 plugins here

